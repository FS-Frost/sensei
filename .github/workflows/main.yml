name: Deploy to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    test-build-deploy:
        runs-on: ubuntu-latest
        # Para publicar en la rama gh-pages con el token del workflow.
        permissions:
            contents: write
        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v7

            # Bun fijo (el mismo que en desarrollo): una versión nueva no debe romper el deploy sin aviso.
            - uses: oven-sh/setup-bun@v2.2.0
              with:
                  bun-version: 1.3.14

            - name: Install dependencies
              run: bun install

            - name: Type check
              run: bun run check

            - name: Run tests
              run: bun test

            # Descargas de jmdict-simplified (data/raw): se reutilizan entre ejecuciones. Una entrada por mes
            # (jmdict-simplified publica cada semana; build-dict baja lo que falte) en lugar de una por ejecución.
            - name: Month key
              id: month
              run: echo "key=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

            - name: Cache dictionary sources
              uses: actions/cache@v5
              with:
                  path: data/raw
                  key: jmdict-raw-${{ steps.month.outputs.key }}
                  restore-keys: jmdict-raw-

            - name: Build dictionary (common + full)
              run: bun run build:dict --variants common,full
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            # Base del sitio: /<repo> (o vacía si el repo es <usuario>.github.io).
            - name: Build
              run: |
                  REPO="${{ github.event.repository.name }}"
                  if [[ "$REPO" == *.github.io ]]; then export BASE_PATH=""; else export BASE_PATH="/$REPO"; fi
                  bun run build

            # SPA: index.html para la raíz y 404.html para cualquier ruta profunda.
            - name: SPA entry points
              run: cp build/404.html build/index.html

            - name: Generate build info
              run: |
                  echo "{\"sha\": \"${{ github.sha }}\", \"ref\": \"${{ github.ref_name }}\", \"actor\": \"${{ github.actor }}\", \"repo\": \"${{ github.event.repository.name }}\"}" > build/build-info.json

            - name: Generate .nojekyll
              run: echo "" > build/.nojekyll

            - name: Deploy
              uses: JamesIves/github-pages-deploy-action@v4.9.0
              with:
                  branch: gh-pages
                  folder: build
